# hw-wismesh-tap-v2 — board HAL straddle for the RAK WisMesh TAP V2 (RAK10710).
#
# A plain (non-buildable) board component: it doesn't decide what the device
# DOES, it only makes the board usable by an app. The reticulous/reticulous
# buildable adds it with `--with spangap/hw-wismesh-tap-v2` and inherits the
# board's pin maps, bring-up hooks and hardware kconfig.
#
# Owns the WisMesh TAP V2 board HAL (esp-idf/src/wismeshtap.cpp: power rails/
# CS park/battery, conditional/spangap-lcd/: the Home-button input HAL). The
# FT5x06 touch is spangap-lcd's own CONFIG_LCD_TOUCH_* controller and the GNSS
# receiver is the generic spangap/gps straddle — this board only
# supplies their pins. app_main, partitions, the OTA story and the browser SPA
# are NOT here — they belong to the buildable.
# Board reference:
# https://store.rakwireless.com/products/meshtastic-touch-client-wismesh-tap-v2-sx1262
schema_version: 1
name: spangap/hw-wismesh-tap-v2
prefix: wismeshtap
firmware: esp-idf
version: 0.0.0
platforms: [idf]
# What this board pulls in: the on-device LCD UI, because the TAP V2 physically
# has a (touch) screen — drop it with --no-lcd — and the GNSS straddle for the
# built-in RAK12501 (Quectel L76K) receiver. There is no hardware keyboard: the
# board never calls lcdSetHasKeyboard(), so spangap-lcd's on-screen keyboard
# stays active for text input. The buzzer (GPIO 38) and the two case LEDs
# (green 46 / blue 45) are present on the board but unwired — the platform has
# no engine for either.
additional_installs:
  - spangap/spangap-lcd
  - spangap/gps
# Board bring-up as registered Services. app_main is generated by the buildable;
# it constructs these in listed order and walks them (onStart before spangapInit,
# onInit after).
#   WismeshTapBoard.onStart — bare-hardware: both power rails (3V3 peripherals +
#     LoRa) and the shared-SPI CS park; MUST precede spangapInit()'s
#     fs_mount_sd() (the SD card shares the LCD's SPI bus and sits behind the
#     3V3 rail). Its onInit publishes sys.board, which needs storage.
#   WismeshTapLcdInput (conditional/spangap-lcd/, when spangap-lcd): onStart
#     registers the Home-button input HAL before lcdInit. (Touch is not here:
#     it is the lcd component's own CONFIG_LCD_TOUCH_* controller.)
#   WismeshTapBattery.onInit — 1/min esp_timer publishing battery.millivolt /
#     battery.percent. Always on — no UI dependency.
# The when:-gated entry vanishes entirely when spangap-lcd isn't staged. No #if
# anywhere. (The GNSS task is gps's own GpsService, registered at that
# straddle's init_order position, not listed here.)
services:
  - { class: WismeshTapBoard,    header: wismeshtap.h }
  - { class: WismeshTapLcdInput, header: wismeshtap_lcd.h, when: spangap/spangap-lcd }
  - { class: WismeshTapBattery,  header: wismeshtap.h }

# Declarative settings: the board's rows on the System page. What this board
# offers is device-wide, not a program, so it lands on System; the orders put
# Hardware and Display at the top, ahead of the unordered blocks the platform
# straddles contribute there. The Display rows join the section spangap-lcd
# opens — section titles merge on an exact match. s.lcd.* rows are defaultless:
# those defaults are owned by spangap-lcd; this block only surfaces the keys.
# (The GPS section is gps's own contribution.)
settings:
  - at: [ { id: system } ]
    order: 10
    rows:
      - section: "Hardware"
      - info:
          rows:
            - value:  { label: "Board", key: "sys.board" }
            - value:  { label: "Touch", key: "lcd.touch" }
  - at: [ { id: system } ]
    order: 20
    rows:
      - section: "Display"
      - slider: { label: "Backlight",      key: "s.lcd.backlight",          min: 0, max: 255 }
      - integer: { label: "Dim after", unit: "s",  key: "s.lcd.inactivity_timeout", min: 0, max: 120 }

# Board VALUES, fed to the symbols other straddles / IDF DEFINE through the
# collected staging/sdkconfig.spangap-fragments. A board straddle is non-
# buildable, so its sdkconfig.defaults would be IGNORED — everything that
# describes this hardware MUST live here in kconfig: to survive `--with`.
kconfig:
  # Board memory: the WisMesh TAP V2 is built around the RAK3312 WisBlock Core
  # (the RAK3112 module: ESP32-S3, 16 MB flash, 8 MB *octal* PSRAM — the
  # module's PlatformIO board definition says memory_type qio_opi). Two numbers:
  #   * FLASHSIZE — the flash CONTAINER / bootloader-header size, pinned to the
  #     real 16 MB chip.
  #   * MAX_FIRMWARE_KB — the offset where the runtime read-write /state
  #     partition begins; /state fills the rest of the chip (~8 MB here). 8 MB
  #     = app+fixed (~3.7 MB on an LCD build) plus growth headroom, same split
  #     as the T-Deck (the other 16 MB LCD board).
  # Changing MAX_FIRMWARE_KB relocates /state → existing devices factory-reset
  # on the next boot, so warn users before bumping it.
  - CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  - CONFIG_SPANGAP_MAX_FIRMWARE_KB=8192
  - CONFIG_SPIRAM_MODE_OCT=y
  # SD card on SPI host 3, sharing SCK/MOSI/MISO with the display (spangap's
  # spi_helper arbitrates the bus); only the CS lines differ (SD 2, panel 12).
  # The card sits behind the 3V3 peripheral rail (GPIO 14, driven by
  # WismeshTapBoard::onStart before the SD probe).
  - CONFIG_SPANGAP_SDCARD=y
  - CONFIG_SPANGAP_SDCARD_BUS_SPI=y
  - CONFIG_SPANGAP_SDCARD_SPI_HOST=3
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_CS=2
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_SCK=13
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MOSI=11
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MISO=10
  # One SX1262 LoRa modem — inside the RAK3112 module itself, wired to a
  # dedicated SPI bus (host 2), separate from the display/SD bus. TCXO is
  # 1.8 V via DIO3; the SX1262 drives DIO2 as its own antenna switch. The
  # radio's supply is gated behind GPIO 4 (BOARD_LORA_POWER_EN_PIN, driven by
  # WismeshTapBoard::onStart — iface-lora has no rail symbol of its own).
  # Gated on iface-lora: the CONFIG_LORA_* symbols are DEFINED by that
  # straddle's Kconfig, so applying these in a build without it would warn as
  # unknown symbols.
  - when: reticulous/iface-lora
    set:
      - CONFIG_LORA_COUNT=1
      - CONFIG_LORA_SPI_HOST=2
      - CONFIG_LORA_SCK_PIN=5
      - CONFIG_LORA_MOSI_PIN=6
      - CONFIG_LORA_MISO_PIN=3
      - CONFIG_LORA0_CS_PIN=7
      - CONFIG_LORA0_DIO1_PIN=47
      - CONFIG_LORA0_BUSY_PIN=48
      - CONFIG_LORA0_RST_PIN=8
      - CONFIG_LORA0_TCXO_MV=1800
      - CONFIG_LORA0_DIO2_RF_SWITCH=y
      - CONFIG_LORA0_RADIO_SX1262=y
  # GNSS receiver (consumed by spangap/gps, staged above) — the built-in
  # RAK12501 (Quectel L76K), NMEA over UART1 8N1, powered off the 3V3 peripheral
  # rail (no independent GPS enable). Host RX <- GPS TX = 44; host TX -> GPS
  # RX = 43 (per the board's Meshtastic variant; MeshCore's bare-RAK3112 variant
  # names the pair the other way round — if the receiver stays silent on real
  # hardware, swap these two). Gated on gps: the CONFIG_GPS_* symbols
  # are DEFINED by that straddle's Kconfig.
  - when: spangap/gps
    set:
      - CONFIG_GPS_UART_NUM=1
      - CONFIG_GPS_RX_PIN=44
      - CONFIG_GPS_TX_PIN=43
  # Display — 2.8" ST7789 320x240 on SPI host 3 (shared with the SD card, CS
  # lines apart). No dedicated panel reset (LCD_RST stays -1; the panel resets
  # with the 3V3 rail). Native portrait 240x320, rotated 90° to the landscape
  # the case is used in. Inert when --no-lcd.
  - CONFIG_LCD_SPI_HOST=3
  - CONFIG_LCD_SCK_PIN=13
  - CONFIG_LCD_MOSI_PIN=11
  - CONFIG_LCD_MISO_PIN=10
  - CONFIG_LCD_CS_PIN=12
  - CONFIG_LCD_DC_PIN=42
  - CONFIG_LCD_BL_PIN=41
  - CONFIG_LCD_PCLK_MHZ=40
  - CONFIG_LCD_CONTROLLER_ST7789=y
  - CONFIG_LCD_NATIVE_WIDTH=240
  - CONFIG_LCD_NATIVE_HEIGHT=320
  - CONFIG_LCD_ROTATION_90=y
  - CONFIG_LCD_INVERT_COLOR=y
  # Touch — FT5x06 on I2C0, brought up by the lcd component (its
  # CONFIG_LCD_TOUCH_* controller; the board contributes no touch code). No
  # reset GPIO routed — the controller resets with the 3V3 rail. The component
  # creates the I2C0 bus itself, which is fine here: touch is the port's only
  # client on this board.
  - CONFIG_LCD_TOUCH_CONTROLLER_FT5X06=y
  - CONFIG_LCD_TOUCH_I2C_SDA=9
  - CONFIG_LCD_TOUCH_I2C_SCL=40
  - CONFIG_LCD_TOUCH_INT_PIN=39
  # LVGL v9 tuning, matching the platform's other ST7789 board (hw-lilygo-tdeck):
  # 16-bit colour matches the panel; Montserrat 12 for launcher labels; LVGL
  # allocations route through spangap's central policy (LV_USE_CUSTOM_MALLOC).
  - CONFIG_LV_COLOR_DEPTH_16=y
  - CONFIG_LV_USE_CUSTOM_MALLOC=y
  - CONFIG_LV_USE_CLIB_STRING=y
  - CONFIG_LV_FONT_MONTSERRAT_12=y
